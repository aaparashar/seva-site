<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join me on seva</title>
<meta name="description" content="See my favorite beauty and wellness spots — and who to ask for — on seva.">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF7F2; color: #1C1C1A;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 0 20px; }
  img { width: 80px; height: auto; display: block; margin: 0 auto 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #7A7570; margin: 0 0 24px; }
  .button { display: inline-block; background: #2B2A27; color: #FAF7F2; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; }
  .small { font-size: 14px; margin-top: 20px; }
  .small a { color: #1C1C1A; }
</style>
</head>
<body>
<main>
  <img src="../seva-mark.png" alt="seva logo" width="80">
  <h1 id="title">Join me on seva</h1>
  <p>Favorite beauty and wellness spots from people you trust — and who to ask for.</p>
  <a id="open" class="button" href="seva://">Open in seva</a>
  <p class="small">Don't have seva yet? It's coming soon to the App Store.<br><a href="../">seva home</a> · <a href="../privacy.html">Privacy</a></p>
</main>
<script>
  // Only accept valid seva usernames; render as text, never HTML.
  var u = (new URLSearchParams(location.search).get("u") || "").toLowerCase();
  if (/^[a-z0-9._]{3,30}$/.test(u)) {
    document.getElementById("title").textContent = "@" + u + " is on seva";
    document.getElementById("open").href = "seva://u/" + encodeURIComponent(u);
  }
</script>
</body>
</html>
