<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join your team on seva</title>
<meta name="description" content="You've been invited to join your salon's team on seva.">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF7F2; color: #1C1C1A;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 0 20px; }
  img { width: 80px; height: auto; display: block; margin: 0 auto 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #7A7570; margin: 0 0 24px; max-width: 34ch; margin-left: auto; margin-right: auto; }
  .button { display: inline-block; background: #2B2A27; color: #FAF7F2; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; }
  .small { font-size: 14px; margin-top: 20px; }
  .small a { color: #1C1C1A; }
</style>
</head>
<body>
<main>
  <img src="../seva-mark.png" alt="seva logo" width="80">
  <h1>You're invited to join your team</h1>
  <p>Open this link on your iPhone to get your verified stylist profile on seva.</p>
  <a id="open" class="button" href="seva://">Open in seva</a>
  <p class="small">Don't have seva yet? Install it, sign in, then tap this link again.<br><a href="../">seva home</a> · <a href="../privacy.html">Privacy</a></p>
</main>
<script>
  // Only pass through a well-formed token; it's never shown on the page.
  var t = new URLSearchParams(location.search).get("t") || "";
  if (/^[A-Za-z0-9_-]{16,64}$/.test(t)) {
    document.getElementById("open").href = "seva://team/" + encodeURIComponent(t);
  }
</script>
</body>
</html>
