<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seva</title>
<meta name="description" content="seva: your people, your wellness.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF7F2; color: #1C1C1A;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 0 20px; }
  img { width: 96px; height: auto; display: block; margin: 0 auto 16px; }
  h1 { font-size: 40px; font-weight: 600; letter-spacing: 3px; margin: 0; }
  .rule { width: 32px; height: 1px; background: #1C1C1A; margin: 12px auto 16px; opacity: .6; }
  p { color: #7A7570; margin: 0 0 28px; }
  a { color: #1C1C1A; }
  nav a { margin: 0 10px; font-size: 14px; }
  .tagline { margin-bottom: 22px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; max-width: 380px; margin: 0 auto 10px; }
  input[type=email] { flex: 1 1 200px; min-width: 0; padding: 13px 14px; border: 1px solid #E8D6C7; border-radius: 12px;
                      background: #fff; color: #1C1C1A; font: inherit; }
  input[type=email]:focus { outline: 2px solid #2B2A27; outline-offset: 1px; }
  button { padding: 13px 18px; border: 0; border-radius: 12px; background: #2B2A27; color: #fff;
           font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer; flex: 1 0 auto; }
  button:disabled { opacity: .6; cursor: default; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .fine { font-size: 14px; color: #6B655E; margin: 0 0 28px; }
  .fine.error { color: #B4483C; }
</style>
</head>
<body>
<main>
  <img src="seva-mark.png" alt="seva logo" width="96">
  <h1>seva</h1>
  <div class="rule"></div>
  <p class="tagline">your people. your wellness.</p>
  <form id="waitlist" novalidate>
    <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
    <input type="email" name="email" placeholder="you@email.com" autocomplete="email" aria-label="Email address" required>
    <button type="submit">join the waitlist</button>
  </form>
  <p class="fine" id="waitlist-note" role="status" aria-live="polite">beta testing in NYC.</p>
  <nav><a href="terms.html">terms of use</a> <a href="privacy.html">privacy policy</a> <a href="mailto:hello@findseva.app">contact</a></nav>
</main>
<script>
  // Posts to the join-waitlist edge function (supabase/functions/join-waitlist).
  // ?ref=ig_bio on the link records where the visitor came from.
  (function () {
    var form = document.getElementById("waitlist");
    var note = document.getElementById("waitlist-note");
    var button = form.querySelector("button");
    var ref = (new URLSearchParams(location.search).get("ref") || "home").toLowerCase();

    function say(text, isError) {
      note.textContent = text;
      note.className = isError ? "fine error" : "fine";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { say("that email doesn't look right.", true); return; }
      button.disabled = true;
      button.textContent = "joining…";
      fetch("https://fefpdelkahctwklhlshl.supabase.co/functions/v1/join-waitlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, source: ref, website: form.website.value })
      }).then(function (r) {
        if (!r.ok) throw r.status;
        form.style.display = "none";
        say("you're on the list. we'll be in touch.");
      }).catch(function (status) {
        button.disabled = false;
        button.textContent = "join the waitlist";
        say(status === 429 ? "lots of signups right now. try again in a bit." : "couldn't add you. try again?", true);
      });
    });
  })();
</script>
</body>
</html>
